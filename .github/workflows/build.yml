name: Build Cyanide

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install ldid
        run: brew install ldid

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify ldid and ChOma
        run: |
          which ldid
          ls Cyanide/XPF/external/ChOma/src/ | head -5
          ls Cyanide/XPF/Makefile

      - name: Build XPF manually (verbose)
        run: |
          cd Cyanide/XPF
          make output/ios/libxpf.dylib 2>&1 | tail -40

      - name: Build Cyanide app
        run: |
          xcodebuild -project Cyanide.xcodeproj \
            -scheme Cyanide \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Cyanide.app Payload/
          zip -r Cyanide-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-unsigned
          path: Cyanide-unsigned.ipa
